# Test a published vanilla image from quay.io/phasetwo/keycloak.
#
#   KC_TAG=26.7.2 docker compose -p kc-26.7.2 \
#     -f p2/docker/docker-compose.vanilla.yml up
#
# Use a distinct -p per tag so each version gets its own database volume;
# reusing one across tags means Keycloak migrates the schema on switch, which
# works forwards and fails backwards.
#
# Keycloak:   http://localhost:8080   (admin / admin)
# Management: http://localhost:9000/health/ready
#
# Override the port pair with KC_PORT / KC_MGMT_PORT to run two tags at once.
# Set KC_CMD=start-dev for a quick look with no database at all.

services:
  postgres:
    image: postgres:${PG_VERSION:-16-alpine}
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/phasetwo/keycloak:${KC_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-INFO}
    command: ${KC_CMD:-start}
    ports:
      - "${KC_PORT:-8080}:8080"
      - "${KC_MGMT_PORT:-9000}:9000"
    healthcheck:
      # The image is ubi9-micro and has no curl or wget, so the check goes
      # through the JVM that is already there.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  pgdata:
