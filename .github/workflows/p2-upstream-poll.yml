name: Poll upstream tags

# A fork gets no events when upstream pushes a tag, so we look.
#
# Nothing is remembered between runs: "already done?" is answered by asking the
# fork for a <version>_crdb branch and quay.io for a <version> image tag. Delete
# an image and the next poll rebuilds it. The only stored state is
# p2/baseline-tags.txt, the set of tags that already existed at activation, which
# stops the first run trying to build years of history.

on:
  schedule:
    # Every six hours. Upstream releases a handful of tags a month, so this is
    # about latency, not throughput -- worst case a new tag waits six hours.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Only consider this version (blank = everything new)'
        required: false
        type: string
        default: ''
      ignore_baseline:
        description: 'Also consider tags that predate activation (backfill)'
        type: boolean
        default: false
      force:
        description: 'Ignore the already-published checks and rebuild'
        type: boolean
        default: false
      skip_crdb:
        description: 'Skip CRDB ports'
        type: boolean
        default: false
      skip_vanilla:
        description: 'Skip vanilla images'
        type: boolean
        default: false
      dry_run:
        description: 'Report what would be built and stop'
        type: boolean
        default: false

# Must cover what the called workflows declare, not just what the detect job
# needs: a called workflow cannot be granted more than its caller has, and
# p2-crdb-release needs contents:write to push the branch and
# pull-requests:write to open a review PR. Declaring less here made every call
# fail at startup, before any job ran.
permissions:
  contents: write
  pull-requests: write

concurrency:
  # One poll at a time. Two concurrent polls would both see the same missing
  # branch and both try to port it.
  group: p2-poll
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect work
    runs-on: ubuntu-latest
    outputs:
      crdb_matrix: ${{ steps.detect.outputs.crdb_matrix }}
      vanilla_matrix: ${{ steps.detect.outputs.vanilla_matrix }}
      released_matrix: ${{ steps.detect.outputs.released_matrix }}
      crdb_count: ${{ steps.detect.outputs.crdb_count }}
      vanilla_count: ${{ steps.detect.outputs.vanilla_count }}
      released_count: ${{ steps.detect.outputs.released_count }}
      has_work: ${{ steps.detect.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        env:
          ONLY_VERSION: ${{ inputs.version }}
          IGNORE_BASELINE: ${{ inputs.ignore_baseline && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          SKIP_CRDB: ${{ inputs.skip_crdb && '1' || '0' }}
          SKIP_VANILLA: ${{ inputs.skip_vanilla && '1' || '0' }}
        run: p2/scripts/detect-work.sh

  crdb:
    name: CRDB ${{ matrix.version }}
    needs: detect
    if: needs.detect.outputs.crdb_count != '0' && inputs.dry_run != true
    strategy:
      # One at a time, ascending, because each port is based on the previous
      # release's branch. Running 26.7.3 and 26.7.4 together would base both on
      # 26.7.2; serialised, 26.7.4 re-resolves and picks up 26.7.3_crdb.
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.crdb_matrix) }}
    uses: ./.github/workflows/p2-crdb-release.yml
    with:
      version: ${{ matrix.version }}
      base: ${{ matrix.base }}
    # Still not `secrets: inherit` -- only these two cross the boundary, so an
    # unrelated secret can never be picked up down the call chain. They are
    # passed explicitly rather than read from the callee's `publish`
    # environment because environment secrets come back empty over
    # workflow_call: the 26.7.3 poll did enter that environment (the deployment
    # record exists, ref=p2-ci) and still called docker/login-action with an
    # empty username, while the same workflow dispatched directly logged in
    # fine. Passing them means they must be repository secrets, as a job with
    # `uses:` cannot declare an environment of its own.
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  vanilla:
    name: Vanilla ${{ matrix.version }}
    needs: detect
    if: needs.detect.outputs.vanilla_count != '0' && inputs.dry_run != true
    strategy:
      # Independent of each other -- nothing chains -- but capped so a backfill
      # cannot saturate the runners.
      max-parallel: 2
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.vanilla_matrix) }}
    uses: ./.github/workflows/p2-vanilla-release.yml
    with:
      version: ${{ matrix.version }}
    # See the note on the crdb job above.
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}

  # Content is downstream of shipping images, so this depends only on `detect`:
  # the article gets drafted while the builds are still running, rather than
  # forty minutes later. A release matters most on the day it lands.
  #
  # It also means a failed build does not suppress the article. The release is
  # real either way, and readers still need the CVE verdict.
  notify-content:
    name: Draft the release article
    needs: detect
    if: needs.detect.outputs.released_count != '0' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      # `released_matrix`, not `vanilla_matrix`. Keying this off build work was
      # wrong: an image already on quay makes vanilla_count 0, which would skip
      # the article for a release that had genuinely just happened. "Is this a
      # new release?" and "do we still owe an image for it?" are different
      # questions, and they diverge on any re-run, backfill, or retry after a
      # failed dispatch. released_matrix is every in-scope tag, recorded before
      # the already-published filter.
      - name: Dispatch to content-marketing
        env:
          GH_TOKEN: ${{ secrets.CONTENT_DISPATCH_TOKEN }}
          MATRIX: ${{ needs.detect.outputs.released_matrix }}
        run: |
          set -euo pipefail
          # One dispatch per version. The receiving workflow serialises on a
          # concurrency group, so several at once queue rather than race.
          #
          # `gh api` is checked on exit status, not output: on a 403 it prints
          # the error body to stdout, which reads as a successful response.
          rc=0
          while read -r version; do
            [ -n "$version" ] || continue
            if gh api -X POST /repos/p2-inc/content-marketing/dispatches \
                 -f event_type=keycloak-release \
                 -f "client_payload[version]=${version}" >/dev/null; then
              echo "dispatched ${version}"
            else
              echo "::warning::Could not dispatch ${version} to content-marketing." \
                   "Draft it by hand: gh workflow run keycloak-release-article.yml" \
                   "-R p2-inc/content-marketing -f version=${version}"
              rc=1
            fi
          done < <(echo "$MATRIX" | python3 -c \
            'import json,sys; [print(e["version"]) for e in json.load(sys.stdin)["include"]]')
          exit $rc
        # Shipping images is the job; drafting an article is not. A dispatch
        # failure warns and leaves the poll green -- the annotation carries the
        # manual command, so it is visible rather than silent.
        continue-on-error: true
